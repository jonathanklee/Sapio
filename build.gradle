// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    dependencies {
        classpath 'com.google.dagger:hilt-android-gradle-plugin:2.54'
    }
}

plugins {
    id 'com.android.application' version '8.11.2' apply false
    id 'com.android.library' version '8.11.2' apply false
    id 'org.jetbrains.kotlin.android' version '2.1.0' apply false
    id 'org.jetbrains.kotlin.jvm' version '2.1.0' apply false
    id 'jacoco'

    alias libs.plugins.detekt apply false
    alias libs.plugins.compose.compiler apply false
}

jacoco {
    toolVersion = "0.8.13"
    reportsDirectory = layout.buildDirectory.dir("jacocoReports")
}

tasks.register("jacocoAggregatedReport", JacocoReport) {
    dependsOn ':app:testDebugUnitTest', ':data:testDebugUnitTest', ':domain:test'

    reports {
        xml.required = true
        html.required = true
    }

    def generatedFilter = [
            '**/R.class',
            '**/R$*.class',
            '**/BuildConfig.*',
            '**/Manifest*.*',
            '**/*Test*.*',
            '**/Hilt_*.*',
            '**/*_Factory*.*',
            '**/*_MembersInjector*.*',
            '**/*_HiltModules*.*',
            '**/*_Impl*.*',
            '**/*_GeneratedInjector*.*',
            '**/hilt_aggregated_deps/**',
            '**/dagger/hilt/**',
            '**/databinding/**/*.*'
    ]

    def modules = [':app', ':data', ':domain'].collect { project(it) }

    sourceDirectories.from = files(modules.collect { "${it.projectDir}/src/main/java" })
    classDirectories.from = files(modules.collect { module ->
        [
                fileTree(dir: "${module.buildDir}/tmp/kotlin-classes/debug", excludes: generatedFilter),
                fileTree(dir: "${module.buildDir}/classes/kotlin/main", excludes: generatedFilter)
        ]
    }.flatten())
    executionData.from = files(modules.collect {
        fileTree(dir: "${it.buildDir}", includes: ["**/*.exec", "**/*.ec"])
    })
}

tasks.register("jacocoCoverageVerification", JacocoCoverageVerification) {
    dependsOn tasks.jacocoAggregatedReport

    sourceDirectories.from = tasks.jacocoAggregatedReport.sourceDirectories
    classDirectories.from = tasks.jacocoAggregatedReport.classDirectories
    executionData.from = tasks.jacocoAggregatedReport.executionData

    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.38
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

subprojects {
    apply plugin: 'io.gitlab.arturbosch.detekt'

    detekt {
        source = files(
                "src/main/java"
        )

        config.setFrom(rootProject.file("detekt.yml"))
        parallel = false
        buildUponDefaultConfig = true
        allRules = false
        disableDefaultRuleSets = false
        debug = false
        ignoreFailures = false
        basePath = projectDir
    }

    dependencies {
        detektPlugins libs.detekt.formatting
    }
}



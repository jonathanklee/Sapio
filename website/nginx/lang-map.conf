# Home page language negotiation. Goes in the http context, so
# /etc/nginx/conf.d/. Pairs with lang-home.conf.

# First tag only, so "en-US,fr;q=0.9" stays English.
map $http_accept_language $preferred_lang {
    default  "";
    ~*^fr    /fr;
    ~*^de    /de;
    ~*^it    /it;
    ~*^es    /es;
}

# An explicit pick beats the browser header, otherwise choosing EN bounces
# straight back to the guess.
map $cookie_lang $chosen_lang {
    default  $preferred_lang;
    "en"     "";
    "fr"     /fr;
    "de"     /de;
    "it"     /it;
    "es"     /es;
}

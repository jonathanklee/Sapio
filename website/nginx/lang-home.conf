# Include from the checksap.io server block. Needs $chosen_lang, defined in
# lang-map.conf.

# Exact match, so only the bare home page negotiates. Deep pages arrive from
# search, where hreflang already picked the variant.
location = / {
    add_header Vary "Accept-Language, Cookie";

    # 302 not 301, which would be cached for good and trap the visitor.
    # $is_args$args because `return` drops the query string.
    if ($chosen_lang) {
        return 302 $chosen_lang/$is_args$args;
    }

    try_files /index.html =404;
}
